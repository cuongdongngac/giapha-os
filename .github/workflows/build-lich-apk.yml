name: Build Lịch Âm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lich-am/**"
      - ".github/workflows/build-lich-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lich-am
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#2f5d45' --splashBackgroundColor '#fbf7ef'
          npx cap sync android

      - name: Dùng khóa ký cố định (để bản mới cài đè được bản cũ)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Đã dùng khóa ký của dòng họ"
          else
            echo "::warning::Chưa có secret ANDROID_DEBUG_KEYSTORE — APK được ký bằng khóa tạm, bản sau sẽ không cài đè được."
          fi

      - name: Build APK
        working-directory: lich-am/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/LichHoPham-$(date +%Y%m%d).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lich-ho-pham-apk
          path: lich-am/dist/*.apk
